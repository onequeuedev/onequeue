openapi: 3.1.0
info:
  title: OneQueue Upload API
  version: 1.0.0
  summary: The endpoints used by OneQueue Scan (onequeuedev/onequeue).
  description: |
    OneQueue by Keytrion Labs.

    This document describes only the client-facing contract used by the
    GitHub Action: uploading redacted findings and reading the gate verdict.
    Scoring, de-duplication and policy evaluation happen on the server and
    are not part of this contract.

    **Retries and idempotency.** The client retries `POST /v1/uploads` up to
    3 times with exponential backoff on network errors, `408`, `429` and
    `5xx`. Every attempt for the same upload carries the same
    `Idempotency-Key`. The server must return the original upload for a
    repeated key with an identical body, and `409` for a repeated key with a
    different body. Keys should be retained for at least 24 hours.

    **Redirects** are never followed by the client, so the `Authorization`
    header is never sent to another location.
  contact:
    name: Keytrion Labs
    email: security@keytrionlabs.com
servers:
  - url: https://api.keytrionlabs.com
security:
  - bearerAuth: []

paths:
  /v1/uploads:
    post:
      operationId: createUpload
      summary: Upload redacted findings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Content-Encoding
          in: header
          required: true
          description: The body is always gzip-compressed JSON.
          schema:
            type: string
            const: gzip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadEnvelope'
      responses:
        '202':
          description: Upload accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
        '200':
          description: Replay of an earlier request with the same Idempotency-Key and body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Idempotency-Key reused with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Rate limited. The client honours Retry-After (seconds, capped at 10).
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        5XX:
          $ref: '#/components/responses/Error'

  /v1/uploads/{uploadId}/verdict:
    get:
      operationId: getVerdict
      summary: Gate verdict for an upload
      description: |
        Polled every 2 seconds by the action in gate mode until `status` is
        `pass` or `fail`, or until `gate-timeout` elapses. `5xx`, `408` and
        `429` responses are treated as transient and polling continues; any
        other `4xx` stops polling and the action applies `on-timeout`.
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UploadId'
      responses:
        '200':
          description: Current verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verdict'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OneQueue API key (GitHub secret ONEQUEUE_API_KEY).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, identical on every retry of the same upload.
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    UploadId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'
      examples: [upl_01JD3W9Q8Z]

    UploadAccepted:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/UploadId'
        status:
          type: string
          examples: [processing]

    Verdict:
      type: object
      required: [status]
      properties:
        id:
          $ref: '#/components/schemas/UploadId'
        status:
          type: string
          enum: [pending, pass, fail]
        reason:
          type: string
          maxLength: 500
          description: Short human-readable explanation, printed in the job log.
          examples: ['2 critical findings exceed fail-on=critical']
        detailsUrl:
          type: string
          format: uri
          description: https link to the upload in OneQueue.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              maxLength: 64
              description: Stable machine-readable code.
              examples: [unauthorized, invalid_payload, idempotency_conflict, rate_limited, internal_error]
            message:
              type: string
              description: Human-readable message. Must not contain secrets; the client prints it.
            requestId:
              type: string
              maxLength: 64
              description: Server request ID for support.

    UploadEnvelope:
      type: object
      required: [schemaVersion, mode, failOn, metadata, sarif]
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        mode:
          type: string
          enum: [upload, gate]
        failOn:
          type: string
          enum: [critical, high, none]
          description: Severity threshold the server applies when computing the verdict.
        metadata:
          $ref: '#/components/schemas/Metadata'
        sarif:
          $ref: '#/components/schemas/RedactedSarif'

    Metadata:
      type: object
      additionalProperties: false
      required: [repository, sha, ref, eventName, pullRequest, runId, runAttempt, runUrl, actionVersion, scanners]
      properties:
        repository: { type: string, examples: [acme/app] }
        sha: { type: string, description: 'GITHUB_SHA (40 or 64 hex chars), empty if unavailable.' }
        ref: { type: string, examples: [refs/pull/42/merge] }
        eventName: { type: string, examples: [pull_request] }
        pullRequest:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [number]
              properties:
                number: { type: integer, minimum: 1 }
                headSha: { type: string }
                headRef: { type: string }
                baseRef: { type: string }
        runId: { type: string }
        runAttempt: { type: string }
        runUrl: { type: string }
        actionVersion: { type: string }
        scanners:
          type: object
          additionalProperties: false
          properties:
            trivy: { $ref: '#/components/schemas/ScannerReport' }
            semgrep: { $ref: '#/components/schemas/ScannerReport' }
            gitleaks: { $ref: '#/components/schemas/ScannerReport' }

    ScannerReport:
      type: object
      additionalProperties: false
      required: [status, findings]
      properties:
        status: { type: string, enum: [ok, failed, skipped] }
        findings: { type: integer, minimum: 0 }
        version: { type: string }

    RedactedSarif:
      description: A SARIF 2.1.0 log containing only the fields below.
      type: object
      additionalProperties: false
      required: [version, runs]
      properties:
        version: { type: string, const: '2.1.0' }
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tool, results]
            properties:
              tool:
                type: object
                additionalProperties: false
                required: [driver]
                properties:
                  driver:
                    type: object
                    additionalProperties: false
                    required: [name, rules]
                    properties:
                      name: { type: string }
                      version: { type: string }
                      rules:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [id]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            shortDescription:
                              type: object
                              additionalProperties: false
                              properties:
                                text: { type: string }
                            helpUri: { type: string, format: uri }
                            properties:
                              type: object
                              additionalProperties: false
                              properties:
                                security-severity: { type: string, pattern: '^(10(\.0+)?|\d(\.\d+)?)$' }
              results:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [ruleId, level, message]
                  properties:
                    ruleId: { type: string }
                    level: { type: string, enum: [none, note, warning, error] }
                    message:
                      type: object
                      additionalProperties: false
                      required: [text]
                      properties:
                        text: { type: string, maxLength: 1000 }
                    locations:
                      type: array
                      maxItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required: [physicalLocation]
                        properties:
                          physicalLocation:
                            type: object
                            additionalProperties: false
                            required: [artifactLocation]
                            properties:
                              artifactLocation:
                                type: object
                                additionalProperties: false
                                required: [uri]
                                properties:
                                  uri: { type: string, description: Repository-relative path. }
                              region:
                                type: object
                                additionalProperties: false
                                required: [startLine, endLine]
                                properties:
                                  startLine: { type: integer, minimum: 1 }
                                  endLine: { type: integer, minimum: 1 }
                    properties:
                      type: object
                      additionalProperties: false
                      properties:
                        fixedVersion: { type: string }
