name: Release image

# Builds the container image for linux/amd64 and linux/arm64, pushes it to Docker Hub and prints the digest to pin
# in action.yml (runs.image). Run it by hand: Actions -> Release image -> Run workflow, and give the version.
#
# Needs, in the repository settings (Secrets and variables -> Actions):
#   secret DOCKERHUB_USERNAME  the Docker Hub account that owns the image (onequeuedev)
#   secret DOCKERHUB_TOKEN     a Docker Hub access token for that account (Read & Write)
#
# The image name is set once, in IMAGE_NAME below.
#
# Order of a release (the full list is in the README, "Releasing"):
#   1. run this workflow with the version  ->  2. scripts/pin-image.sh <digest> from its summary  ->  3. commit
#   4. tag vX.Y.Z  ->  5. create the GitHub Release with notes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # The one place the image name lives: Docker Hub account/repository.
      IMAGE_NAME: onequeuedev/onequeue
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi

      - name: Check the Docker Hub secrets exist
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: ACTION_VERSION=${{ inputs.version }}
          # Same image under both spellings, to match the git tag vX.Y.Z.
          tags: |
            docker.io/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            docker.io/${{ env.IMAGE_NAME }}:v${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Docker Hub images are attested under index.docker.io.
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # The attestation is stored by GitHub; verify it with
          # gh attestation verify oci://index.docker.io/onequeuedev/onequeue@<digest> --owner onequeuedev
          push-to-registry: false

      - name: Print digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Image digest: ${DIGEST}"
          {
            echo "## OneQueue Scan image ${VERSION}"
            echo
            echo "Image: \`docker.io/${IMAGE_NAME}:${VERSION}\` (linux/amd64, linux/arm64)"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Next: pin it in action.yml, commit, tag v${VERSION}:"
            echo
            echo '```sh'
            echo "scripts/pin-image.sh ${DIGEST} ${VERSION}"
            echo '```'
            echo
            echo "which sets:"
            echo
            echo '```yaml'
            echo "  image: docker://${IMAGE_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
