name: Release image

# Builds the container image, pushes it to Docker Hub (docker.io/rhysha/onequeuedev)
# and prints the digest to pin in action.yml. See RELEASING.md.
#
# Needs, in the repository settings (Secrets and variables -> Actions):
#   secret DOCKERHUB_TOKEN  a Docker Hub access token (Read & Write) for the user rhysha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE: docker.io/rhysha/onequeuedev
      # Docker Hub images are attested under index.docker.io.
      ATTEST_SUBJECT: index.docker.io/rhysha/onequeuedev
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: rhysha # Docker Hub user; not a secret
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: ACTION_VERSION=${{ inputs.version }}
          # Same image under both spellings, to match the git tag vX.Y.Z.
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:v${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ATTEST_SUBJECT }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # The attestation is stored by GitHub; verify it with
          # gh attestation verify oci://index.docker.io/rhysha/onequeuedev@<digest> --owner onequeuedev
          push-to-registry: false

      - name: Print digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Image digest: ${DIGEST}"
          {
            echo "## OneQueue Scan image ${VERSION}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Pin it in action.yml:"
            echo
            echo '```yaml'
            echo "  image: docker://${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
