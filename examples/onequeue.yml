# Example workflow for a repository that uses OneQueue Scan.
#
# Copy this file to .github/workflows/onequeue.yml in YOUR repository, then:
#   1. Add the secret ONEQUEUE_API_KEY (Settings -> Secrets and variables -> Actions).
#   2. `@v1` follows every 1.x release. To pin an exact release instead, replace it with the
#      40-character commit SHA of that release and add a Dependabot entry for github-actions.
#
# Pushes to the default branch and a daily scheduled run upload findings (never
# fails the build). The daily run catches vulnerabilities that are published
# against packages you already use, when nothing in your code changed.
# Pull requests are gated by the OneQueue server verdict: the check fails on
# findings at or above `fail-on` and on new secrets. Secrets are decided by the
# server too (baseline, triage and build rules apply), so an old secret that
# you accepted does not block every pull request.
#
# Do not switch this to `pull_request_target`: it would run untrusted fork
# code with access to your secrets. With `pull_request`, fork PRs get an empty
# api-key; the action then skips the upload and runs Gitleaks locally only,
# and fails the check only for secrets in lines the pull request changed.
#
# To ignore a known false positive, list its Gitleaks fingerprint
# (path:rule-id:line) in a .gitleaksignore file at the root of the repository.

name: OneQueue Scan

on:
  push:
    branches: [main] # your default branch
  pull_request:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC

permissions:
  contents: read

concurrency:
  group: onequeue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest # Linux only: OneQueue Scan is a Docker container action
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth: 0       # needed with gitleaks-history: true; for fork PRs it also
          #                      guarantees the base commit is there for the changed-lines check

      - name: OneQueue Scan
        id: onequeue
        uses: onequeuedev/onequeue@v1 # or a full commit SHA, see above
        with:
          api-key: ${{ secrets.ONEQUEUE_API_KEY }}
          api-url: https://api.onequeue.dev # the default; shown so it is easy to see where findings go
          mode: ${{ github.event_name == 'pull_request' && 'gate' || 'upload' }}
          fail-on: high # critical | high | none
          gate-timeout: 60 # seconds to wait for the server verdict
          on-timeout: pass # pass | fail when no verdict arrives in time
          # scanners: trivy,semgrep,gitleaks
          # semgrep-config: p/default
          # gitleaks-history: false

      - name: Show result
        if: always()
        env:
          UPLOAD_ID: ${{ steps.onequeue.outputs.upload-id }}
          FINDINGS: ${{ steps.onequeue.outputs.findings }}
          VERDICT: ${{ steps.onequeue.outputs.verdict }}
        run: echo "upload=$UPLOAD_ID findings=$FINDINGS verdict=$VERDICT"
